<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百數圖｜倍數與質數探索</title>
<style>
*{box-sizing:border-box}
body{font-family:"Microsoft JhengHei",sans-serif;background:#f3f7fb;color:#24364b;margin:0}
main{max-width:1000px;margin:auto;padding:16px}
h1{font-size:1.7rem}h2{font-size:1.2rem}
.panel{background:white;padding:18px;border-radius:15px;margin:14px 0;box-shadow:0 2px 10px #0001}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button,select{font:inherit;padding:10px;border:1px solid #b9c8d9;border-radius:9px;background:white;color:#24364b;cursor:pointer}
button.active,button.primary{background:#1769aa;color:white;border-color:#1769aa}
button:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;max-width:720px;margin:auto}
.cell{aspect-ratio:1;padding:0;font-size:clamp(12px,2vw,21px);font-weight:bold;border-radius:7px;background:#f7faff}
.correct,.prime{background:#bceccc}
.missed{background:#ffdf9d}
.wrong{background:#ffb4b4}
.a{background:#bcdcff}.b{background:#ffe19a}.both{background:#cdb8f5}
.composite{background:#dfe3e8;color:#65717d}.one{background:#fff0c5}
.hidden{display:none}
#message{background:#edf5ff;border-radius:9px;padding:12px;margin:12px 0;min-height:45px}
.note{color:#526477;line-height:1.6}
@media(max-width:520px){main{padding:9px}.panel{padding:11px}.grid{gap:3px}.cell{border-radius:4px}}
</style>
</head>
<body>
<main>
<h1>百數圖｜倍數與質數探索</h1>
<p class="note">自己找倍數、觀察公倍數、探索質數。不計時，也不需要解鎖關卡。</p>
<div class="controls">
<button class="active" data-mode="practice">① 倍數基礎練習</button>
<button data-mode="relation">② 倍數關係探索</button>
<button data-mode="prime">③ 質數探索</button>
</div>
<section class="panel" id="practice">
<h2>倍數基礎練習</h2>
<div class="controls">
<select id="level">
<option value="basic">基礎：2～10</option>
<option value="middle">進階：11～15</option>
<option value="high">挑戰：16～20</option>
<option value="all">綜合：2～20</option>
</select>
<select id="number"></select>
<button id="random">隨機選擇</button>
</div>
<p class="note">請逐一點選正確的倍數，答錯可以再試。全部找好後，按「完成檢查」。</p>
<div class="controls">
<button class="primary" id="finish">完成檢查</button>
<button id="hint">給我提示</button>
<button id="restart">重新練習</button>
</div>
<p id="hintText" class="note"></p>
</section>
<section class="panel hidden" id="relation">
<h2>倍數關係探索</h2>
<p class="note">先找第一組，再找第二組。兩組共同的倍數會呈現紫色。</p>
<div class="controls">
<select id="first"></select>
<select id="second"></select>
</div>
<div class="controls">
<button class="primary" id="next">完成第一組，開始第二組</button>
<button id="checkRelation">完成檢查</button>
<button id="common">只看公倍數</button>
<button id="resetRelation">重新探索</button>
</div>
<p class="note">藍色：第一組　黃色：第二組　紫色：兩組重疊</p>
</section>
<section class="panel hidden" id="prime">
<h2>質數探索：埃拉托斯特尼篩法</h2>
<p class="note">1不是質數，也不是合數。依序保留2、3、5、7，篩除它們的其他倍數。</p>
<div class="controls">
<button data-sieve="2">篩除2的其他倍數</button>
<button data-sieve="3">篩除3的其他倍數</button>
<button data-sieve="5">篩除5的其他倍數</button>
<button data-sieve="7">篩除7的其他倍數</button>
<button id="showPrimes">顯示所有質數</button>
<button id="resetPrime">重新開始</button>
</div>
</section>
<section class="panel">
<div id="message" role="status" aria-live="polite"></div>
<div id="grid" class="grid"></div>
<p id="summary" class="note"></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const nums=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const prime=n=>n>=2&&!nums(2,Math.floor(Math.sqrt(n))).some(k=>n%k===0);
let mode="practice",selected=new Set(),done=false;
let stage=0,groups=[new Set(),new Set()],checked=false,onlyCommon=false;
let sieves=new Set(),showAll=false;
function msg(t){$("message").textContent=t}
function fill(id,values){$(id).innerHTML=values.map(n=>'<option value="'+n+'">'+n+'的倍數</option>').join("")}
function choices(){let x=$("level").value;return x==="basic"?nums(2,10):x==="middle"?nums(11,15):x==="high"?nums(16,20):nums(2,20)}
function startPractice(){selected=new Set();done=false;$("hintText").textContent="";msg("請找出 "+$("number").value+" 的所有倍數。");draw()}
function startRelation(){stage=0;groups=[new Set(),new Set()];checked=false;onlyCommon=false;$("next").disabled=false;$("common").textContent="只看公倍數";msg("第一步：找出 "+$("first").value+" 的倍數。");draw()}
function startPrime(){sieves=new Set();showAll=false;msg("從2開始，依序篩除合數。");draw()}
function draw(){
let grid=$("grid");grid.innerHTML="";
let target=+$("number").value,a=+$("first").value,b=+$("second").value;
for(let n=1;n<=100;n++){
let el=document.createElement("button");el.className="cell";el.textContent=n;
if(mode==="practice"){
if(selected.has(n))el.classList.add("correct");
else if(done&&n%target===0)el.classList.add("missed");
}
if(mode==="relation"){
let A=checked?n%a===0:groups[0].has(n);
let B=checked?n%b===0:groups[1].has(n);
if(A&&B)el.classList.add("both");
else if(A)el.classList.add("a");
else if(B)el.classList.add("b");
if(onlyCommon&&!(A&&B))el.style.opacity=".2";
}
if(mode==="prime"){
if(n===1)el.classList.add("one");
else if(n>1&&[...sieves].some(p=>n!==p&&n%p===0))el.classList.add("composite");
else if(prime(n)&&(showAll||sieves.has(n)))el.classList.add("prime");
}
el.disabled=mode==="prime"||(mode==="practice"&&done)||(mode==="relation"&&checked);
el.onclick=()=>choose(n);grid.appendChild(el);
}
if(mode==="practice")$("summary").textContent="已找到 "+selected.size+" 個；完成前不顯示還有幾個。";
if(mode==="relation"){
let common=nums(1,100).filter(n=>n%a===0&&n%b===0);
$("summary").textContent=checked?"公倍數："+(common.join("、")||"100以內沒有")+"；最小公倍數："+(common[0]||"超過100"):"目前正在尋找 "+(stage===0?a:b)+" 的倍數。";
}
if(mode==="prime")$("summary").textContent=showAll||sieves.size===4?"100以內共有25個質數。":"灰色表示已篩除的合數。";
}
function choose(n){
if(mode==="practice"){
let t=+$("number").value;
if(n%t===0){selected.add(n);msg("答對！"+n+" 是 "+t+" 的倍數。")}
else msg(n+" 不是 "+t+" 的倍數，再試一次。");
}
if(mode==="relation"){
let t=+(stage===0?$("first").value:$("second").value);
if(n%t===0){groups[stage].add(n);msg("答對！"+n+" 是 "+t+" 的倍數。")}
else msg(n+" 不是 "+t+" 的倍數，再找找看。");
}
draw();
}
document.querySelectorAll("[data-mode]").forEach(btn=>btn.onclick=()=>{
mode=btn.dataset.mode;
document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b===btn));
["practice","relation","prime"].forEach(m=>$(m).classList.toggle("hidden",m!==mode));
if(mode==="practice")startPractice();
if(mode==="relation")startRelation();
if(mode==="prime")startPrime();
});
$("level").onchange=()=>{fill("number",choices());startPractice()};
$("number").onchange=startPractice;
$("random").onclick=()=>{let list=choices();$("number").value=list[Math.floor(Math.random()*list.length)];startPractice()};
$("restart").onclick=startPractice;
$("finish").onclick=()=>{
done=true;let t=+$("number").value,all=nums(1,100).filter(n=>n%t===0);
let missed=all.filter(n=>!selected.has(n));
msg(missed.length?"找到 "+selected.size+" 個，還漏了 "+missed.length+" 個，橘色是遺漏的倍數。":"全部找到了！共 "+all.length+" 個。");
draw();
};
$("hint").onclick=()=>{
let t=+$("number").value,last=Math.max(0,...selected);
$("hintText").textContent="跳數：每次增加 "+t+"。乘法延伸："+t+"×9＝"+t*9+"，"+t+"×10＝"+t*10+"。"+(last?"你已找到 "+last+"，試試看再加 "+t+"。":"");
};
fill("first",nums(2,20));fill("second",nums(2,20));
$("first").value="2";$("second").value="3";
$("first").onchange=startRelation;$("second").onchange=startRelation;
$("next").onclick=()=>{
let a=+$("first").value;
let missing=nums(1,100).filter(n=>n%a===0&&!groups[0].has(n));
if(missing.length){msg("第一組還有 "+missing.length+" 個沒有找到，請繼續尋找。");return}
stage=1;$("next").disabled=true;msg("第一組完成！現在找 "+$("second").value+" 的倍數。");draw();
};
$("checkRelation").onclick=()=>{
if(stage===0){msg("請先完成第一組。");return}
checked=true;msg("比較完成！紫色代表兩組共同的倍數。");draw();
};
$("common").onclick=()=>{onlyCommon=!onlyCommon;$("common").textContent=onlyCommon?"顯示所有倍數":"只看公倍數";draw()};
$("resetRelation").onclick=startRelation;
document.querySelectorAll("[data-sieve]").forEach(btn=>btn.onclick=()=>{
let p=+btn.dataset.sieve,order=[2,3,5,7];
let earlier=order.slice(0,order.indexOf(p)).filter(n=>!sieves.has(n));
if(earlier.length){msg("請先篩選 "+earlier.join("、")+" 的倍數。");return}
sieves.add(p);msg("保留 "+p+"，篩除它的其他倍數。");
if(sieves.size===4)msg("篩選完成！綠色是100以內的25個質數。");
draw();
});
$("showPrimes").onclick=()=>{sieves=new Set([2,3,5,7]);showAll=true;msg("已顯示100以內的25個質數。");draw()};
$("resetPrime").onclick=startPrime;
fill("number",choices());startPractice();
</script>
</body>
</html>
